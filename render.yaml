services:
  - type: web
    name: backend-labs-01
    runtime: node
    rootDir: lab-01
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER_EXTERNAL_URL
        value: https://backend-labs-01.onrender.com
    autoDeploy: true

  - type: web
    name: backend-labs-02
    runtime: node
    rootDir: lab-02
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER_EXTERNAL_URL
        value: https://backend-labs-02.onrender.com
    autoDeploy: true

  - type: web
    name: backend-labs-03
    runtime: node
    rootDir: lab-03
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER_EXTERNAL_URL
        value: https://backend-labs-03.onrender.com
    autoDeploy: true



